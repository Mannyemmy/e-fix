---
deployment:
  tasks:
    - mkdir -p /home/elitccyv/e-fix/storage/app/public
    # Refuse to continue if public_html/storage is a REAL directory - it may hold
    # uploaded media, and blindly removing it would destroy every upload.
    - '[ -e /home/elitccyv/public_html/storage ] && [ ! -L /home/elitccyv/public_html/storage ] && { echo "ABORT: public_html/storage is a real directory, not a symlink. It may contain uploaded media. Back it up and move it into e-fix/storage/app/public, then redeploy."; exit 1; } || true'
    - ln -sfn /home/elitccyv/e-fix/storage/app/public /home/elitccyv/public_html/storage
    - rsync -a --timeout=30 --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='storage/app/public' --exclude='storage/logs' --exclude='bootstrap/cache' . /home/elitccyv/e-fix/
    - rsync -a --timeout=30 --exclude='.git' --exclude='storage' ./public/ /home/elitccyv/public_html/
    - sed -i "s|__DIR__.'/../vendor/autoload.php'|'/home/elitccyv/e-fix/vendor/autoload.php'|g" /home/elitccyv/public_html/index.php
    - sed -i "s|__DIR__.'/../bootstrap/app.php'|'/home/elitccyv/e-fix/bootstrap/app.php'|g" /home/elitccyv/public_html/index.php
    - sed -i "s|__DIR__.'/../storage/framework/maintenance.php'|'/home/elitccyv/e-fix/storage/framework/maintenance.php'|g" /home/elitccyv/public_html/index.php
    - rm -f /home/elitccyv/e-fix/bootstrap/cache/*.php
    - cd /home/elitccyv/e-fix && timeout 30 php artisan config:clear || true
    - cd /home/elitccyv/e-fix && timeout 30 php artisan cache:clear || true
    - cd /home/elitccyv/e-fix && timeout 30 php artisan view:clear || true
    - cd /home/elitccyv/e-fix && timeout 30 php artisan route:clear || true
    - mkdir -p /home/elitccyv/e-fix/storage/app/public
    # -f replaces an existing symlink, -n stops it resolving into the target dir.
    # Idempotent, and never deletes a real directory.
    - ln -sfn /home/elitccyv/e-fix/storage/app/public /home/elitccyv/public_html/storage
    # Apache serves static files as `nobody`, not as the cPanel user, so it needs
    # traverse permission on the app root to reach storage/app/public through the
    # symlink above. rsync -a copies the source dir mode onto e-fix, which can reset
    # this to 700 and make every /storage/* URL 404 again. o+x grants traversal only:
    # the directory still cannot be listed or read.
    - chmod o+x /home/elitccyv/e-fix
    - cd /home/elitccyv/e-fix && timeout 60 php artisan migrate --force || true
    - cd /home/elitccyv/e-fix && timeout 60 php artisan db:seed --class=BlockedChatPatternSeeder --force || true
